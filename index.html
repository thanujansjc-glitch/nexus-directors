<style>
html,body{margin:0;background:#1f242b;color:#f4f6f8}

#nxlock .hd{display:flex;gap:12px;align-items:center}
#nxlock .mk{width:34px;height:34px;border-radius:9px;background:#3fb950;color:#0d1a10;display:grid;place-items:center;font-weight:700}
#nxlock b{font-size:17px}#nxlock .sub{font-size:13px;color:#9aa3ad}
#nxlock input[type=password]{width:100%;box-sizing:border-box;background:#1f242b;color:#f4f6f8;border:1px solid #2b323b;border-radius:10px;padding:12px;font-size:16px}

#nxbar button{background:none;border:0;color:#3fb950;font:inherit;font-weight:600;cursor:pointer;padding:0 0 0 8px}
</style>
<script>
/* Directors' view: stands in for the Claude data connection with a password-locked, read-only copy of the data. */
(function(){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
  let ready; const dataP = new Promise(r => ready = r);
  async function decrypt(pw){
    const r = await fetch("data.enc.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("load");
    const e = await r.json();
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(e.salt), iterations:e.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    let plain; try{ plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(e.iv)}, key, b64(e.ct)); }catch(x){ throw new Error("pw"); }
    return JSON.parse(new TextDecoder().decode(plain));
  }
  const deny = () => Promise.reject({ code:"not_granted", message:"Read-only directors' view" });
  function snap(list){ list = list || []; return { size:list.length, empty:!list.length, docs:list.map(d => ({ id:d.id, exists:true, data:() => { const o = Object.assign({}, d); delete o.id; return o; } })) }; }
  function makeDb(DATA){
    const cols = DATA.cols || {}, docs = DATA.docs || {};
    const find = path => { if(Object.prototype.hasOwnProperty.call(docs, path)) return docs[path]; const i = path.lastIndexOf("/"); const c = path.slice(0,i), id = path.slice(i+1); const d = (cols[c]||[]).find(x => x.id === id); if(!d) return null; const o = Object.assign({}, d); delete o.id; return o; };
    const docRef = path => ({ id:path.split("/").pop(), path,
      onSnapshot(cb){ const v = find(path); setTimeout(() => cb({ id:path.split("/").pop(), exists:v != null, data:() => v }), 0); return () => {}; },
      get: async () => { const v = find(path); return { id:path.split("/").pop(), exists:v != null, data:() => v }; },
      set:deny, update:deny, delete:deny });
    const colRef = c => { const q = { onSnapshot(cb){ setTimeout(() => cb(snap(cols[c])), 0); return () => {}; }, get: async () => snap(cols[c]),
      where(){ return q; }, orderBy(){ return q; }, limit(){ return q; }, doc(id){ return docRef(c + "/" + (id || "x")); }, add:deny }; return q; };
    return { collection: colRef, doc: docRef };
  }
  const user = { id: async () => null, me: async () => ({}), can: async () => false, canEdit: async () => false, isOwner: async () => false, profiles: async () => ({}), search: async () => [] };
  window.claude = { use: async name => { const D = await dataP; if(name === "db") return makeDb(D); if(name === "user") return user; return null; } };

  function asAt(D){ const s = (D.at || "").slice(0,10); if(!s) return ""; const [y,m,d] = s.split("-").map(Number); return `${d} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1]} ${y}`; }
  function lock(){ store.del("nx-dir-pw"); location.reload(); }
  async function open(pw, remember){
    const err = document.getElementById("nxerr"), btn = document.getElementById("nxgo");
    err.textContent = ""; btn.disabled = true; btn.textContent = "Opening…";
    try{
      const D = await decrypt(pw);
      if(remember) store.set("nx-dir-pw", pw);
      document.getElementById("nxlock").remove();
      const bar = document.getElementById("nxbar");
      bar.innerHTML = `<div>Directors' view · figures as at ${asAt(D)}<button type="button" id="nxout">Lock</button></div>`; bar.hidden = false;
      document.getElementById("nxout").onclick = lock;
      ready(D);
      setTimeout(() => { const t = document.getElementById("synctxt"); if(t) t.textContent = "View only"; }, 800);
    }catch(e){
      store.del("nx-dir-pw");
      err.textContent = e.message === "pw" ? "That password isn't right." : "Couldn't load the figures. Check your connection and try again.";
      btn.disabled = false; btn.textContent = "Open";
    }
  }
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("nxf").addEventListener("submit", ev => { ev.preventDefault(); open(document.getElementById("nxpw").value, document.getElementById("nxrem").checked); });
    const saved = store.get("nx-dir-pw"); if(saved){ document.getElementById("nxrem").checked = true; open(saved, true); }
  });
})();
</script>

<body>
<div id="nxlock">
  <form id="nxf">
    <div class="hd"><div class="mk">N</div><div><b>Nexus Property Developers</b><div class="sub">Directors' view of the Finance Desk</div></div></div>
    <input type="password" id="nxpw" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
    <label><input type="checkbox" id="nxrem"> Remember on this phone</label>
    <button id="nxgo" type="submit">Open</button>
    <div class="err" id="nxerr" role="alert"></div>
  </form>
</div>

<style>
/* Layout: phone-first app shell — sticky header, single scrolling column (max 760px), fixed bottom tab bar, bottom-sheet editor */
/* Always-dark "market ticker" palette: charcoal-navy background, white figures, red/green movement colours */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
  --bg:#1f242b; --surface:#252b33; --surface-2:#2b323b; --line:#161a1f; --fg:#f4f6f8; --muted:#9aa3ad;
  --accent:#3fb950; --accent-ink:#0d1a10; --accent-soft:#1f3a26; --brass:#d6a74c;
  --good:#3fb950; --good-soft:#1c3324; --warn:#e3a33b; --warn-soft:#3a2d16; --bad:#ef5f56; --bad-soft:#3f2224;
  --shadow:none; color-scheme:dark;
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.top h1{font-family:var(--f-display);font-size:17px;margin:0;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--muted)}
.top .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.err{background:var(--bad)}
@media (max-width:420px){.sync span:last-child{display:none}}
main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 110px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--f-display);font-size:16px;margin:0;font-weight:600}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.hero{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:16px;padding:18px}
.hero .eyebrow{color:inherit;opacity:.8}
.hero .big{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.hero .meta{font-size:13px;opacity:.85;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;text-align:left}
.kpi .v{font-family:var(--f-display);font-size:20px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
button.kpi{display:block;width:100%}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .amt{font-weight:600;text-align:right;white-space:nowrap}
.item .amt small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;vertical-align:1px}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ex{background:transparent;color:var(--brass);border-color:var(--brass)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.alert .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--muted);flex:none}
.alert.bad .bar{background:var(--bad)} .alert.warn .bar{background:var(--warn)} .alert.good .bar{background:var(--good)}
.alert .t{display:block;font-weight:600} .alert .d{display:block;font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;display:inline-flex;align-items:center;gap:4px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.banner{border:1px dashed var(--brass);border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;color:var(--fg)}
.banner b{color:var(--brass)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.aging{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin-top:10px}
.aging span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px 12px;margin-top:10px;font-size:12px}
.legend div{display:flex;gap:6px;align-items:center;min-width:0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-weight:600}
.prog{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.prog span{display:block;height:100%;background:var(--accent)}
.prog.warn span{background:var(--warn)} .prog.bad span{background:var(--bad)}
.pm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-top:12px;font-size:13px}
.pm .l{color:var(--muted)} .pm .n{font-weight:600}
.auto{font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-left:4px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-top:0}
tr.tot td{font-weight:700;border-top:2px solid var(--fg)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.neg,.neg{color:var(--bad)}
.stmt{display:flex;flex-direction:column;font-size:14px}
.stmt>div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;padding:7px 0;border-top:1px solid var(--line)}
.stmt.one>div{grid-template-columns:minmax(0,1fr) auto}
.stmt>div:first-child{border-top:0}
.stmt>div>span:not(:first-child){text-align:right;min-width:84px}
.stmt .sum{font-weight:700;border-top:1.5px solid var(--fg)}
.stmt .hd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stmt .ind span:first-child{padding-left:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.ugrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.ugrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ucard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 11px;text-align:left;min-width:0;display:flex;flex-direction:column;gap:3px}
.ucard .u{font-family:var(--f-display);font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ucard .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucard.Booked{border-color:var(--accent)} .ucard.Sold{border-color:var(--good)} .ucard.Reserved{border-color:var(--warn)}
.hist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.hist div{display:flex;gap:8px;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px}
.hist div:first-child{border-top:0;padding-top:0}
.hist .w{color:var(--muted);text-align:right;flex:none}
.qt td:first-child,.qt th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;white-space:normal;min-width:148px;max-width:190px}
.qt tr.grp td{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding-top:14px}
.qt tr.sumr td{font-weight:700}
.sens td.base{background:var(--accent-soft);color:var(--accent);font-weight:700}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart-legend i.ln{height:3px;border-radius:2px;vertical-align:3px;width:14px}
.asm{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.asm:first-of-type{border-top:0}
.asm .an{font-weight:600}.asm .av{color:var(--accent);font-weight:600}
.asm .ab{font-size:13px;color:var(--muted)}
@media (min-width:620px){.asm{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) minmax(0,1.8fr);gap:12px}}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;border:0;background:var(--accent);color:var(--accent-ink);border-radius:16px;height:52px;padding:0 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;align-items:center;gap:8px;font-size:15px}
.fab svg{width:20px;height:20px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;line-height:1.15;text-align:center;font-weight:600;color:var(--muted);min-height:58px}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(8,16,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:620px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.fld .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 11px;font-size:16px;width:100%;min-width:0}
.fld textarea{min-height:64px;resize:vertical}

(function(){

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N = v => { const n = typeof v === "number" ? v : parseFloat(String(v ?? "").replace(/[,\s]/g,"").replace(/^LKR/i,"")); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const T = iso(TODAY);
const days = (a,b) => Math.round((new Date(b+"T00:00") - new Date(a+"T00:00"))/864e5);
const addMonths = (s, m) => { const [y,mo,d] = s.split("-").map(Number); const dt = new Date(y, mo-1+m, 1); const last = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate(); dt.setDate(Math.min(d, last)); return iso(dt); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fdate = s => { if(!s) return "—"; const [y,m,d] = s.split("-"); return (+d)+" "+MON[+m-1]+" "+y; };
const fmonth = s => { if(!s) return "—"; const [y,m] = s.split("-"); return MON[+m-1]+" "+y; };
const fm = n => (n < 0 ? "−" : "") + Math.abs(Math.round(n)).toLocaleString("en-US");
const fmM = n => { const a = Math.abs(n); const s = a >= 1e9 ? (a/1e9).toFixed(2)+"bn" : a >= 1e6 ? (a/1e6).toFixed(1)+"m" : a >= 1e3 ? Math.round(a/1e3)+"k" : String(Math.round(a)); return (n < 0 ? "−" : "") + s; };
const pct = (a,b) => b ? Math.max(0, Math.min(100, a/b*100)) : 0;
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const sum = (arr, f) => arr.reduce((s,x) => s + f(x), 0);

/* ---------- schema ---------- */

  bs:{ one:"balance sheet", sheet:"Balance sheet", fields:[
    {k:"date",l:"Balance sheet date",t:"date",req:1,full:1},
    {k:"_h1",l:"Assets",t:"head"},

    {k:"_h1",l:"Buyer & payment plan",t:"head"},
    {k:"customer",l:"Buyer",t:"text",full:1},

    {k:"bank",l:"Bank",t:"text"},
    {k:"project",l:"Project",t:"project"},
    {k:"facility",l:"Facility (LKR)",t:"num",req:1},

    {k:"actual",l:"Spent to date (LKR)",t:"num"},

    {k:"note",l:"Basis / notes",t:"area",full:1}]}
};
const COLS = Object.keys(S);
const DEF = {
  banks:{asOf:"T", type:"Current"}, cash:{date:"T", direction:"Out"}, tax:{status:"To do"}, pl:{month:"M"}, bs:{date:"T"},
  units:{status:"Available", bookingPct:40, instalments:6, frequency:"Month", pricePerSqft:43000},
  loans:{rate:12, graceMonths:12, repayMonths:24, status:"Applied", inForecast:"Yes"}, costs:{head:"Construction"}
};
const LABEL = {
  banks:r=>r.name, recv:r=>[r.customer, r.unit && "unit "+r.unit, r.ref].filter(Boolean).join(" · "), pay:r=>[r.supplier, r.ref].filter(Boolean).join(" · "),
  cash:r=>r.description, tax:r=>r.item, pl:r=>fmonth(r.month)+" accounts", bs:r=>"Balance sheet "+fdate(r.date), projects:r=>r.name,
  units:r=>"Unit "+r.unit+" · "+r.project, loans:r=>r.name, costs:r=>r.project+" · "+r.head
};

/* ---------- state ---------- */
const D = {}; const loaded = {}; COLS.forEach(c => { D[c] = []; loaded[c] = false; });
let db = null, userNS = null, uid = null, dl = null, canWrite = true, connState = "connecting";
const ui = { view:"home", recvF:"open", payF:"open", taxF:"upcoming", rep:"pl", fy:null, proj:null, uProj:null, uF:"all" };
try { const h = (location.hash||"").slice(1); if(["home","cash","recv","pay","tax","reports","p65"].includes(h)) ui.view = h; else { const v = ls.get("nx-view"); if(v) ui.view = v; } } catch(e){}

/* ---------- derived ---------- */
const outR = r => Math.max(0, N(r.amount) - N(r.received));
const outP = p => Math.max(0, N(p.amount) - N(p.paid));
const cashAtBank = () => sum(D.banks, b => N(b.balance));
const recvOpen = () => D.recv.filter(r => outR(r) > 0.5);
const payOpen = () => D.pay.filter(p => outP(p) > 0.5);
const taxOpen = () => D.tax.filter(t => t.status !== "Paid" && !(t.status === "Filed" && !N(t.amount)));
const examples = () => COLS.reduce((n,c) => n + D[c].filter(x => x.example).length, 0);
const unitPrice = u => N(u.price) || N(u.sqft) * N(u.pricePerSqft);
const isSold = u => u.status === "Booked" || u.status === "Sold";
const projNames = () => [...new Set(D.projects.map(p=>p.name).concat(D.units.map(u=>u.project), D.loans.map(l=>l.project), D.costs.map(c=>c.project)).filter(Boolean))].sort();

function loanSched(l){
  const draws = (Array.isArray(l.drawdowns) ? l.drawdowns : []).filter(d => d && d.date && N(d.amount) > 0).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const res = { draws, rows:[], drawn: sum(draws, d=>N(d.amount)) };
  if(!draws.length) return res;
  const g = Math.max(0, Math.round(N(l.graceMonths))), r = Math.max(1, Math.round(N(l.repayMonths) || 1)), rate = N(l.rate)/100/12;
  let bal = 0, di = 0;
  for(let m = 1; m <= g + r; m++){
    const d = addMonths(draws[0].date, m);
    while(di < draws.length && draws[di].date < d){ bal += N(draws[di].amount); di++; }
    const interest = bal * rate, principal = m > g ? bal / (g + r - m + 1) : 0;
    bal -= principal;
    res.rows.push({ date:d, interest, principal, payment: interest + principal, bal });
  }
  return res;
}
function loanOutstanding(l, at){
  const s = loanSched(l); at = at || T;
  return Math.max(0, sum(s.draws.filter(d => d.date <= at), d => N(d.amount)) - sum(s.rows.filter(r => r.date <= at), r => r.principal));
}
function projStats(p){
  const name = p.name, us = D.units.filter(u => u.project === name), rv = D.recv.filter(r => r.project === name);
  const cl = D.costs.filter(c => c.project === name), ln = D.loans.filter(l => l.project === name);
  const s = { auto:{} };
  if(us.length){ s.units = us.length; s.sold = us.filter(isSold).length; s.salesValue = sum(us.filter(isSold), unitPrice); s.stock = sum(us.filter(u=>!isSold(u)), unitPrice); s.auto.units = 1; }
  else { s.units = N(p.units); s.sold = N(p.unitsSold); s.salesValue = N(p.salesValue); }
  if(rv.length){ s.collected = sum(rv, r => N(r.received)); s.auto.collected = 1; } else s.collected = N(p.collected);
  if(cl.length){ s.budget = sum(cl, c=>N(c.budget)); s.cost = sum(cl, c=>N(c.actual)); s.committed = sum(cl, c=>N(c.committed)); s.auto.cost = 1; }
  else { s.budget = N(p.budget); s.cost = N(p.costToDate); s.committed = 0; }
  if(ln.length){ s.facility = sum(ln, l=>N(l.facility)); s.loanOut = sum(ln, l=>loanOutstanding(l)); s.auto.loan = 1; }
  else { s.facility = N(p.loanFacility); s.loanOut = N(p.loanOutstanding); }
  return s;
}
function agingOf(rows, outFn){
  const b = [0,0,0,0,0];
  rows.forEach(r => { const o = outFn(r); if(o <= 0) return; const od = days(r.dueDate || T, T);
    b[od <= 0 ? 0 : od <= 30 ? 1 : od <= 60 ? 2 : od <= 90 ? 3 : 4] += o; });
  return b;
}
function forecast(){
  const y0 = TODAY.getFullYear(), m0 = TODAY.getMonth();
  const M = []; for(let i=0;i<12;i++){ const d = new Date(y0, m0+i, 1); M.push({key:d.getFullYear()+"-"+pad(d.getMonth()+1), label:MON[d.getMonth()]+" "+String(d.getFullYear()).slice(2), inn:0, out:0, loan:0}); }
  const raw = s => { const [y,m] = s.split("-").map(Number); return (y-y0)*12 + (m-1-m0); };
  const idx = s => { if(!s) return 0; const i = raw(s); return i < 0 ? 0 : i; };
  D.recv.forEach(r => { const o = outR(r); if(o>0 && r.dueDate){ const i = idx(r.dueDate); if(i<12) M[i].inn += o; }});
  D.pay.forEach(p => { const o = outP(p); if(o>0){ const i = idx(p.dueDate); if(i<12) M[i].out += o; }});
  D.tax.forEach(t => { if(t.status !== "Paid" && N(t.amount) > 0){ const i = idx(t.dueDate); if(i<12) M[i].out += N(t.amount); }});
  D.cash.forEach(c => { if(!c.date) return; const i = raw(c.date); if(i < 0 || i > 11) return; if(c.direction === "In") M[i].inn += N(c.amount); else M[i].out += N(c.amount); });
  D.loans.forEach(l => { if(l.inForecast === "No" || l.status === "Settled") return; const s = loanSched(l);
    s.draws.forEach(d => { if(d.date < T) return; const i = raw(d.date); if(i >= 0 && i < 12) M[i].inn += N(d.amount); });
    s.rows.forEach(r => { if(r.date < T) return; const i = raw(r.date); if(i >= 0 && i < 12){ M[i].out += r.payment; M[i].loan += r.payment; } }); });
  let bal = cashAtBank(); M.forEach(m => { m.open = bal; bal += m.inn - m.out; m.close = bal; });
  return M;
}
function buildSchedule(u){
  const price = unitPrice(u), bp = N(u.bookingPct), n = Math.max(0, Math.round(N(u.instalments)));
  const step = u.frequency === "Quarter" ? 3 : u.frequency === "6 months" ? 6 : 1;
  const rows = [], book = Math.round(price * bp / 100);
  if(book > 0) rows.push({ ref:`Booking ${bp}%`, dueDate:u.bookingDate, amount:book });
  const rest = price - book;
  if(n > 0 && rest > 0){ const each = Math.round(rest / n); let left = rest;
    for(let i=0;i<n;i++){ const a = i === n-1 ? left : each; left -= a; rows.push({ ref:`Instalment ${i+1} of ${n}`, dueDate:addMonths(u.firstInstDate, i*step), amount:a }); } }
  return rows;
}

  if(done) return chip("Settled","good");

  if(d < 0) return chip(-d+"d overdue","bad");

  if(d <= 14) return chip("Due in "+d+"d","warn");

}

function syncCard(){
  const s = SYNC;
  const files = s && Array.isArray(s.files) ? s.files : [];
  const skipped = s && Array.isArray(s.skipped) ? s.skipped : [];
  const changes = s ? N(s.changes) : 0;
  const ago = s && s.ranAt ? days(String(s.ranAt).slice(0,10), T) : null;

  return `<section class="card stack">

    <p class="note" style="margin:0">${s ? `Last run ${fdate(String(s.ranAt).slice(0,10))}: ${files.length} file${files.length!==1?"s":""} read, ${changes} record${changes!==1?"s":""} updated.` : "Files saved in the Nexus drop folder on Google Drive are read every day at about 6 pm Sri Lanka time and update this app automatically."}</p>
    ${files.length ? `<div class="stmt one">${files.slice(0,5).map(f=>`<div><span>${esc(f.name)}</span><span class="note">${esc(f.result||"")}</span></div>`).join("")}</div>` : ""}
    ${skipped.length ? `<div class="stmt one">${skipped.slice(0,5).map(f=>`<div><span>${esc(f.what||f.name||"Item")}</span><span class="note" style="color:var(--warn)">${esc(f.reason||"needs checking")}</span></div>`).join("")}</div>` : ""}
    <div class="row">${isOwnerView && mcpNS ? `<button class="btn small primary" type="button" data-act="importnow" ${importState.busy?"disabled":""}>${importState.busy ? "Starting…" : "Import new files now"}</button>` : ""}<a class="btn small" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit" href="${DRIVE_URL}" target="_blank" rel="noopener">Open drop folder</a></div>
    ${importState.msg ? `<p class="note" style="margin:0;${importState.err?"color:var(--bad)":""}">${esc(importState.msg)}</p>` : `<p class="note" style="margin:0">New files are checked every hour from about 9 am to 9 pm Sri Lanka time.</p>`}
  </section>`;
}
const IMPORT_TASK = "trig_018DzKm9QhoSPsCyKHsUT3Qz";
let mcpNS = null, isOwnerView = false;
const importState = { busy:false, msg:"", err:false };
async function importNow(){
  if(!mcpNS || importState.busy) return;
  importState.busy = true; importState.msg = ""; importState.err = false; render();
  try{
    await mcpNS.callTool("Claude Code Remote", "fire_trigger", { trigger_id: IMPORT_TASK, text: "Started from the app's Import now button." }, { cache:false });
    importState.msg = "Import started. New files usually appear here within 5–10 minutes.";
  }catch(e){
    importState.err = true;
    const c = e && e.code;
    importState.msg = c === "server_not_connected" ? "Add the Claude Code Remote connector in claude.ai Settings → Connectors to use this button."
      : c === "needs_reauth" ? "Reconnect Claude Code Remote in claude.ai Settings → Connectors, then try again."
      : c === "not_in_manifest" || c === "approval_required" ? "The import wasn't allowed. Tap again and choose Allow when asked."
      : c === "tool_error" ? "The import couldn't be started: " + (e.message || "the scheduled task refused it") + "."
      : c === "server_unavailable" || c === "upstream_error" ? "No answer from the import service. Wait a minute, then check above before trying again."
      : "The import couldn't be started here. The hourly check will still pick up new files.";
  }
  importState.busy = false; render();
}
async function resolveNames(){
  const els = [...document.querySelectorAll("[data-uid]")]; if(!els.length || !userNS) return;
  try{ const ps = await userNS.profiles([...new Set(els.map(e=>e.dataset.uid))]);
    els.forEach(e => { const p = ps[e.dataset.uid]; if(p) e.textContent = p.isMe ? "You" : (p.name || "A colleague"); }); }catch(e){}
}

function fabFor(){
  if(ui.view === "cash") return ["banks","Bank balance"];
  if(ui.view === "recv") return ui.sSub === "units" ? ["units","Unit"] : ["recv","Instalment"];
  if(ui.view === "pay") return ui.cSub === "budget" ? (ui.proj ? ["costs","Cost line"] : ["projects","Project"]) : ["pay","Supplier bill"];
  if(ui.view === "tax") return ["tax","Deadline"];

    return {pl:["pl","Month"], bs:["bs","Balance sheet"], units:["units","Unit"], loans:["loans","Loan"]}[ui.rep] || null;

function forecastChart(fc, compact){
  const W = 640, H = compact ? 170 : 220, L = 52, R = 12, Tp = 14, B = 26;
  const vals = fc.map(m => m.close).concat([fc[0].open]);
  let mn = Math.min(0, ...vals), mx = Math.max(0, ...vals); if(mx === mn) mx = mn + 1;
  const padv = (mx-mn)*0.08; mx += padv; if(mn < 0) mn -= padv;
  const x = i => L + (W-L-R) * (i/(fc.length-1)), y = v => Tp + (H-Tp-B) * (1 - (v-mn)/(mx-mn));
  const ticks = 4, step = (mx-mn)/ticks; let g = "";
  for(let i=0;i<=ticks;i++){ const v = mn + step*i; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmM(v)}</text>`; }
  const pts = fc.map((m,i) => `${x(i)},${y(m.close)}`).join(" ");
  const area = `${x(0)},${y(Math.max(mn,0))} ${pts} ${x(fc.length-1)},${y(Math.max(mn,0))}`;
  let lb = ""; fc.forEach((m,i) => { if(compact && i%2) return; lb += `<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${m.label.split(" ")[0]}</text>`; });
  const lowI = fc.reduce((a,m,i) => m.close < fc[a].close ? i : a, 0);
  const zero = mn < 0 ? `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--bad)" stroke-dasharray="4 3" stroke-width="1.2"/>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected month-end cash balance for the next 12 months">${g}${zero}
    <polygon points="${area}" fill="var(--accent)" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${fc.map((m,i)=>`<circle cx="${x(i)}" cy="${y(m.close)}" r="${i===lowI?5:2.5}" fill="${i===lowI?(m.close<0?"var(--bad)":"var(--brass)"):"var(--accent)"}"/>`).join("")}
    ${lb}</svg>`;
}

  return `<section class="card"><div class="eyebrow">${title}</div><div style="font-family:var(--f-display);font-size:24px;font-weight:700">LKR ${fm(tot)}</div>
    <div class="aging" role="img" aria-label="Ageing split">${b.map((v,i)=>v>0?`<span style="width:${pct(v,tot)}%;background:${col[i]}"></span>`:"").join("")}</div>

function taxStatusChip(t){
  if(t.status === "Paid") return chip("Paid","good");
  if(t.status === "Filed") return chip("Filed","good");
  const d = t.dueDate ? days(T,t.dueDate) : 99;
  if(d < 0) return chip((t.status||"To do")+" · "+(-d)+"d late","bad");
  if(d <= 14) return chip((t.status||"To do")+" · "+d+"d left","warn");
  return chip(t.status || "To do");
}

function fyOf(month){ const [y,m] = month.split("-").map(Number); const s = m >= 4 ? y : y-1; return s+"/"+String(s+1).slice(2); }
function plSum(rows){

  s.gp = s.revenue - s.cos; s.op = s.gp - s.admin - s.selling; s.pbt = s.op - s.finance + s.other; s.pat = s.pbt - s.tax; return s;
}

function bsTotals(b){
  const ta = ["ppe","wip","stock","trade","otherRec","cash"].reduce((s,k)=>s+N(b[k]),0);
  const tl = ["tradePay","advances","borrowings","taxPay","otherPay"].reduce((s,k)=>s+N(b[k]),0);
  const te = N(b.capital) + N(b.retained);
  const ca = N(b.stock) + N(b.trade) + N(b.otherRec) + N(b.cash) + N(b.wip);
  const cl = N(b.tradePay) + N(b.advances) + N(b.taxPay) + N(b.otherPay);
  return {ta, tl, te, diff: ta - tl - te, ca, cl};
}

function p65Chart(F, bars, line, label){
  const n = 19, W = 640, H = 270, L = 62, R = 10, Tp = 12, B = 30;
  const labs = F.quarters.slice(0,n), series = bars.map(b => b.v.slice(0,n)), lv = line.v.slice(0,n);
  const all = series.flat().concat(lv, [0]);
  const niceStep = r => { const p = Math.pow(10, Math.floor(Math.log10(r/4))); const m = r/4/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; };
  const rawMin = Math.min(...all), rawMax = Math.max(...all), st = niceStep(rawMax-rawMin);
  const mn = Math.floor(rawMin/st)*st, mx = Math.ceil(rawMax/st)*st;
  const y = v => Tp + (H-Tp-B)*(1-(v-mn)/(mx-mn)), band = (W-L-R)/n, x = i => L + band*i;
  let g = ""; for(let v=mn; v<=mx+1e-6; v+=st) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?"var(--muted)":"var(--line)"}" stroke-width="1"/><text x="${L-8}" y="${y(v)+5}" text-anchor="end" font-size="14" fill="var(--muted)">${fm(v)}</text>`;
  const bw = band*0.76/bars.length;
  let r = ""; series.forEach((s,si) => s.forEach((v,i) => { if(!v) return; const y0 = y(Math.max(v,0)), h = Math.abs(y(v)-y(0)); r += `<rect x="${x(i)+band*0.12+bw*si}" y="${y0}" width="${bw}" height="${Math.max(h,1)}" rx="1" fill="${bars[si].c}"/>`; }));
  const pts = lv.map((v,i)=>`${x(i)+band/2},${y(v)}`).join(" ");
  let lb = ""; labs.forEach((l,i)=>{ if(i%3===0) lb += `<text x="${x(i)+band/2}" y="${H-8}" text-anchor="middle" font-size="14" fill="var(--muted)">${esc(l)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${r}<polyline points="${pts}" fill="none" stroke="${line.c}" stroke-width="2.5" stroke-linejoin="round"/>${lb}</svg>`;
}
function p65Table(F, rows, totalCol, fmt){
  const fv = (r,v) => r.f==="p" ? `<td>${v.toFixed(1)}%</td>` : r.f==="u" ? `<td>${v?v:"–"}</td>` : (fmt?fmt(v):f1c(v));
  return `<div class="card" style="padding:0"><div class="scroll"><table class="qt"><thead><tr><th>LKR mn</th>${totalCol?"<th>Total</th>":""}${F.quarters.map((q,i)=>`<th>Q${i}<br>${esc(q)}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(r => `${r.h?`<tr class="grp"><td>${esc(r.h)}</td><td colspan="${F.quarters.length+(totalCol?1:0)}"></td></tr>`:""}<tr class="${r.sum?"sumr":""}"><td>${esc(r.l)}${r.units!==undefined?` · ${r.units} units`:""}</td>${totalCol?(r.t===null||r.t===undefined?"<td></td>":r.f==="u"?`<td>${r.t}</td>`:f1c(r.t)):""}${r.v.map(v=>fv(r,v)).join("")}</tr>`).join("")}
  </tbody></table></div></div>`;
}

/* ---------- month-end close and lock ---------- */
const MONL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const mName = m => { const [y,mo] = m.split("-").map(Number); return `${MONL[mo-1]} ${y}`; };
const mEnd = m => { const [y,mo] = m.split("-").map(Number); const d = new Date(Date.UTC(y, mo, 0)); return d.toISOString().slice(0,10); };
const mNext = m => { const [y,mo] = m.split("-").map(Number); return mo === 12 ? `${y+1}-01` : `${y}-${String(mo+1).padStart(2,"0")}`; };
const mPrev = m => { const [y,mo] = m.split("-").map(Number); return mo === 1 ? `${y-1}-12` : `${y}-${String(mo-1).padStart(2,"0")}`; };
let canAdmin = false;
const canClose = () => canWrite && !!db && (isOwnerView || canAdmin);
const periodOf = m => (D.periods || []).find(p => p.id === m) || null;
const isClosed = m => !!m && (periodOf(m) || {}).status === "Closed";
const closedDate = d => !!d && typeof d === "string" && d.length >= 7 && isClosed(d.slice(0,7));
function lockMsg(d){ return `${mName(d.slice(0,7))} is closed, so this can't be changed. Reopen the month under Reports → Month-end first.`; }
/* Returns a message when saving (next) or deleting (next = null) would change figures in a closed month. */
function checkLock(col, prev, next){
  const p = prev || {}, n = next || {}, gone = !next;
  const hit = (...ds) => ds.find(closedDate);
  const recDates = r => (Array.isArray(r && r.receipts) ? r.receipts : []).map(x => x && x.date).concat((Array.isArray(r && r.payments) ? r.payments : []).map(x => x && x.date));
  let d = null;
  if(col === "pl") d = [p.month, n.month].map(m => m && m + "-01").find(closedDate);
  else if(col === "bs") d = hit(p.date, n.date);
  else if(col === "cash") d = hit(p.date, n.date);
  else if(col === "banks"){
    if(gone) d = hit(p.asOf);
    else if(!prev || N(p.balance) !== N(n.balance) || p.asOf !== n.asOf) d = hit(n.asOf);
  }
  else if(col === "tax"){
    const changed = gone || !prev || p.status !== n.status || N(p.amount) !== N(n.amount) || (p.doneDate||"") !== (n.doneDate||"");
    if(changed) d = hit(p.doneDate, n.doneDate);
  }
  else if(col === "recv" || col === "pay"){
    const got = col === "recv" ? "received" : "paid";
    if(gone) d = hit(p.dueDate, ...recDates(p));
    else {
      if(!prev || N(p.amount) !== N(n.amount) || (p.dueDate||"") !== (n.dueDate||"")) d = hit(p.dueDate, n.dueDate);
      if(!d && prev && N(n[got]) < N(p[got])) d = hit(p.dueDate, ...recDates(p));
    }
  }
  return d ? lockMsg(d) : null;
}
function monthChecks(m){

const norm = s => String(s||"").toLowerCase().replace(/\(lkr\)/g,"").replace(/[^a-z0-9]/g,"");
const SYN = { customer:["buyer","client","customername","buyername","name"], supplier:["vendor","creditor","suppliername","contractor"], dueDate:["due","duedate","datedue","paymentdate"], amount:["amount","amountdue","invoiceamount","value","total","instalmentamount"], received:["received","amountreceived","receipts","paid","collected"], paid:["paid","amountpaid","payments","payment"], ref:["ref","reference","invoice","invoiceno","billno","instalment","description"], unit:["unit","unitno","apartment","aptno","flat"], balance:["balance","closingbalance","bookbalance"], name:["account","accountname","name"], asOf:["asat","asof","date","balancedate"], sqft:["sqft","size","area","sizesqft"], pricePerSqft:["rate","pricepersqft","ratepersqft"], price:["price","agreedprice","salesvalue","saleprice"], customerU:[], description:["description","item","details"], date:["date","expecteddate"], item:["item","whatisdue","tax"], head:["head","costhead","category"], budget:["budget"], actual:["actual","spent","spenttodate","costtodate"] };
function matchCols(col, headers){
  const map = {}; const used = new Set();
  S[col].fields.forEach(f => { if(f.t === "head" || f.t === "draws") return;
    const cands = [norm(f.l), norm(f.k)].concat(SYN[f.k] || []);
    const h = headers.find(h => !used.has(h) && cands.includes(norm(h)));
    if(h){ map[f.k] = h; used.add(h); } });
  return map;
}
function toISO(v){
  if(v instanceof Date && !isNaN(v)){ const d = new Date(v.getTime() + 12*36e5); return iso(d); }
  if(typeof v === "number" && v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); }
  const s = String(v||"").trim(); let m;
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  if((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))){ const y = m[3].length === 2 ? "20"+m[3] : m[3]; return y+"-"+pad(m[2])+"-"+pad(m[1]); }
  if((m = s.match(/^(\d{4})-(\d{1,2})$/))) return m[1]+"-"+pad(m[2]);
  return "";
}

  if(d.units){ ui.view = "recv"; ui.sSub = "units"; ui.uProj = d.units; ui.proj = null; ls.set("nx-view","recv"); render(); window.scrollTo(0,0); return; }
  if(d.ssub){ ui.sSub = d.ssub; ui.proj = null; render(); window.scrollTo(0,0); return; }
  if(d.csub){ ui.cSub = d.csub; ui.proj = null; render(); window.scrollTo(0,0); return; }
  if(d.cm){ ui.cm = d.cm === "-" ? null : d.cm; render(); window.scrollTo(0,0); return; }
  if(d.ck){ toggleCheck(d.ck); return; }
  if(d.q){ toggleQuery(d.q); return; }
  if(d.uproj){ ui.uProj = d.uproj; render(); return; }
  if(d.uf){ ui.uF = d.uf; render(); return; }
  if(d.add){ if(!db){ toast("Data isn't connected in this view"); return; } openForm(d.add, null, d.preset); return; }
  if(d.edit){ if(!db){ toast("Data isn't connected in this view"); return; } const i = d.edit.indexOf(":"); openForm(d.edit.slice(0,i), d.edit.slice(i+1)); return; }
  switch(d.act){
    case "close": closeSheet(); return;
    case "projback": ui.proj = null; render(); return;
    case "settle": { const f = $("#sheetform");
      if(sheet.col === "recv") f.elements.received.value = f.elements.amount.value;
      if(sheet.col === "pay") f.elements.paid.value = f.elements.amount.value;
      if(sheet.col === "tax"){ f.elements.status.value = "Paid"; if(!f.elements.doneDate.value) f.elements.doneDate.value = T; }
      save(); return; }
    case "sched": schedAfter.msg = null; save(schedAfter).catch(()=>{}); return;
    case "bsfill": bsFill(); return;
    case "adddraw": $("#draws").insertAdjacentHTML("beforeend", drawRow(null)); return;
    case "rmdraw": t.closest(".drow").remove(); return;
    case "del": $("#delrow").innerHTML = `<span class="note">Delete this record for everyone?</span><button class="btn danger small" type="button" data-act="delyes">Yes, delete</button><button class="btn small" type="button" data-act="delno">Keep</button>`; return;
    case "delyes": del(); return;
    case "delno": $("#delrow").innerHTML = `<button class="btn danger small" type="button" data-act="del">Delete</button>`; return;
    case "exclear": { const b = $("#exbanner"); b.innerHTML = `<div>Remove all ${examples()} example rows for everyone? Your own entries stay.</div><div class="row"><button class="btn danger small" data-act="exyes">Remove examples</button><button class="btn small" data-act="exno">Cancel</button></div>`; return; }
    case "exyes": clearExamples(); return;
    case "exno": render(); return;
    case "data": openData(); return;
    case "importnow": importNow(); return;
    case "closemonth": closeMonth(t.dataset.m); return;
    case "reopen": reopenMonth(t.dataset.m); return;
    case "qadd": addQuery(t.dataset.m); return;
    case "qcarry": carryQueries(t.dataset.m); return;
    case "export": doExport(); return;
    case "template": doTemplate(); return;
    case "pickfile": $("#imp-file").click(); return;
    case "doimport": doImport(); return;
  }
});
document.addEventListener("change", e => {
  if(e.target.id === "imp-file" && e.target.files[0]){ handleFile(e.target.files[0]); e.target.value = ""; }
  if(e.target.id === "imp-col"){ imp = null; const o = $("#imp-out"); if(o) o.innerHTML = ""; }
  if(sheet && sheet.col === "units" && e.target.closest("#sheetform")) previewSchedule();
});
document.addEventListener("input", e => { if(sheet && sheet.col === "units" && e.target.closest("#sheetform")){ clearTimeout(previewSchedule.t); previewSchedule.t = setTimeout(previewSchedule, 250); } });
document.addEventListener("submit", e => { if(e.target.id === "sheetform"){ e.preventDefault(); save(); } });
document.addEventListener("keydown", e => { if(e.key === "Escape" && sheet) closeSheet(); });
const _schedRun = schedAfter.run;
schedAfter.run = async function(u, id){ try{ await _schedRun(u, id); } catch(e){ if(e && e.code === "has_receipts"){ schedAfter.msg = "Unit saved. Schedule not replaced because receipts are recorded."; return; } throw e; } };

/* ---------- data connection ---------- */
/* ---------- directors' summary: one small record (sync/directors) read by the daily job that refreshes the password-protected directors' page ---------- */
let dirTimer = null, dirLast = "";
function directorsSummary(){
  const real = c => D[c].filter(x => !x.example);
  const rv = real("recv").filter(r => outR(r) > 0.5), pv = real("pay").filter(p => outP(p) > 0.5);
  const od = r => r.dueDate && days(r.dueDate, T) > 0;
  const soon = (r, n) => r.dueDate && days(T, r.dueDate) >= 0 && days(T, r.dueDate) <= n;
  const projs = [...new Set(rv.map(r => r.project).concat(real("projects").map(p => p.name)).filter(Boolean))].sort();
  const pr = real("projects");
  return {
    today: T,
    banks: real("banks").map(b => ({ name:b.name||"", bank:b.bank||"", type:b.type||"", balance:N(b.balance), asOf:b.asOf||"" })).sort((a,b)=>b.balance-a.balance),
    recv: {
      open: sum(rv, outR), overdue: sum(rv.filter(od), outR), overdueCount: rv.filter(od).length,
      due30: sum(rv.filter(r => soon(r,30)), outR), tbc: sum(rv.filter(r => !r.dueDate), outR),
      byProject: projs.map(p => { const x = rv.filter(r => r.project === p); return { project:p, open:sum(x,outR), overdue:sum(x.filter(od),outR) }; }).filter(x => x.open > 0),
      topOverdue: rv.filter(od).sort((a,b)=>outR(b)-outR(a)).slice(0,10).map(r => ({ customer:r.customer||"", project:r.project||"", unit:r.unit||"", ref:r.ref||"", dueDate:r.dueDate, out:outR(r) })),
      next30: rv.filter(r => soon(r,30)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,15).map(r => ({ customer:r.customer||"", project:r.project||"", unit:r.unit||"", dueDate:r.dueDate, out:outR(r) }))
    },
    pay: {
      open: sum(pv, outP), overdue: sum(pv.filter(od), outP), due14: sum(pv.filter(p => soon(p,14)), outP),
      list: pv.filter(p => od(p) || soon(p,30)).sort((a,b)=>(a.dueDate||"").localeCompare(b.dueDate||"")).slice(0,12).map(p => ({ supplier:p.supplier||"", project:p.project||"", ref:p.ref||"", dueDate:p.dueDate||"", out:outP(p) }))
    },
    tax: real("tax").filter(t => t.status !== "Paid" && !(t.status === "Filed" && !N(t.amount)) && t.dueDate && days(T, t.dueDate) <= 45)
      .sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,12).map(t => ({ item:t.item||t.taxType||"", dueDate:t.dueDate, status:t.status||"", amount:N(t.amount) })),
    projects: pr.map(p => { const s = projStats(p); return { name:p.name||"", status:p.status||"", units:s.units||0, sold:s.sold||0, salesValue:s.salesValue||0, collected:s.collected||0, budget:s.budget||0, cost:s.cost||0, loanOut:s.loanOut||0 }; }),
    loans: real("loans").map(l => ({ name:l.name||"", project:l.project||"", facility:N(l.facility), rate:N(l.rate), status:l.status||"", out:loanOutstanding(l) }))
  };
}
function queueDirectors(){
  if(!db || !canWrite || !COLS.every(c => loaded[c])) return;
  clearTimeout(dirTimer);
  dirTimer = setTimeout(async () => {
    try{
      const s = directorsSummary(), key = JSON.stringify(s);
      if(key === dirLast) return;
      dirLast = key;
      await db.doc("sync/directors").set(Object.assign({ updatedAt: new Date().toISOString() }, s));
    }catch(e){ dirLast = ""; }
  }, 4000);
}
/* ---------- full snapshot for the directors' page: an editor's view uploads the whole data set as one JSON asset (sync/snapshot points at it); the daily job encrypts it for the password-protected copy of this app ---------- */
let loadedPeriods = false; let assetsNS = null, snapTimer = null, snapLastKey = "", snapLastAt = 0, SNAPPTR = null;
function queueSnapshot(){
  if(!assetsNS || !db || !canWrite || !COLS.every(c => loaded[c])) return;
  clearTimeout(snapTimer);
  const wait = Math.max(20000, snapLastAt + 15*60000 - Date.now());
  snapTimer = setTimeout(async () => {
    try{
      const docs = { "sync/latest": SYNC, "feasibility/p65": FEAS, "feasibility/ffs2627": FFS };
      const cols = {}; COLS.forEach(c => cols[c] = D[c]); cols.periods = D.periods || [];
      const key = JSON.stringify({ cols, docs });
      if(key === snapLastKey) return;
      const at = new Date().toISOString();
      const res = await assetsNS.upload(new Blob([JSON.stringify({ v:1, at, cols, docs })], { type:"application/json" }), { type:"application/json" });
      const prev = SNAPPTR && SNAPPTR.id;
      await db.doc("sync/snapshot").set({ id: res.id, at, sizeBytes: res.sizeBytes });
      snapLastKey = key; snapLastAt = Date.now();
      if(prev && prev !== res.id){ try{ await assetsNS.delete(prev); }catch(e){} }
    }catch(e){ snapLastAt = Date.now(); }
  }, wait);
}
function setSync(state, txt){ connState = state; $("#syncdot").className = "dot " + (state==="on"?"on":state==="error"||state==="offline"?"err":""); $("#synctxt").textContent = txt; }
render();
(async () => {
  if(!window.claude || typeof window.claude.use !== "function"){ setSync("offline","Offline"); render(); return; }
  try{ db = await window.claude.use("db"); }catch(e){ db = null; }
  if(!db){ setSync("offline","Sign in to load data"); render(); return; }
  try{ userNS = await window.claude.use("user"); if(userNS){ uid = await userNS.id(); const c = await userNS.can("data.write"); if(c === false) canWrite = false; } }catch(e){}
  try{ dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
  try{ isOwnerView = userNS ? await userNS.isOwner() : false; if(isOwnerView) mcpNS = await window.claude.use("mcp"); }catch(e){ mcpNS = null; }
  if(canWrite){ try{ assetsNS = await window.claude.use("assets"); }catch(e){ assetsNS = null; } }
  try{ canAdmin = userNS ? !!(await userNS.canEdit()) : false; }catch(e){ canAdmin = false; }
  db.collection("periods").onSnapshot(snap => { D.periods = snap.docs.map(d => Object.assign({id:d.id}, d.data())); loadedPeriods = true; if(!sheet) render(); queueSnapshot(); }, () => { loadedPeriods = true; });
  if(assetsNS) db.doc("sync/snapshot").onSnapshot(snap => { SNAPPTR = snap.exists ? snap.data() : null; }, () => {});
  setSync("on", canWrite ? "Live" : "Live · view only");
  db.doc("sync/latest").onSnapshot(snap => { SYNC = snap.exists ? snap.data() : null; if(!sheet && ui.view === "home") render(); }, () => {});
  db.doc("feasibility/p65").onSnapshot(snap => { FEAS = snap.exists ? snap.data() : null; FEAS_READY = true; if(!sheet && (ui.view === "p65" || ui.view === "home")) render(); }, () => { FEAS_READY = true; });
  db.doc("feasibility/ffs2627").onSnapshot(snap => { FFS = snap.exists ? snap.data() : null; if(!sheet && (ui.view === "p65" || ui.view === "home")) render(); }, () => {});
  COLS.forEach(c => {
    db.collection(c).onSnapshot(snap => {
      D[c] = snap.docs.map(d => Object.assign({id:d.id}, d.data())); loaded[c] = true;
      if(!sheet) render();
      queueDirectors();
      queueSnapshot();
    }, err => { loaded[c] = true; setSync("error","Connection lost"); if(!sheet) render(); });
  });
})();
})();
